<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de lugares</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="contenedor">
        <div class="icono">📍</div>

        <h1>Buscar lugares</h1>

        <p class="descripcion">
            Escribe una ciudad o un lugar para consultar su ubicación.
        </p>

        <div class="buscador">
            <input
                type="text"
                placeholder="Ejemplo: Parras de la Fuente"
                id="lugar"
                autocomplete="off"
            >
            <button type="button" id="buscar">Buscar</button>
        </div>

        <div id="resultados"></div>
    </main>
</body>
</html>
